<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecek Data</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --border-color: #e5e7eb;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #8b5cf6;
            --primary-hover: #a78bfa;
            --border-color: #374151;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: var(--transition); }
        
        .header-actions { position: absolute; top: 20px; right: 20px; }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; box-shadow: var(--shadow); transition: var(--transition); }
        .theme-toggle:hover { transform: scale(1.05); }
        .theme-toggle svg { width: 24px; height: 24px; }
        
        .container { background-color: var(--card-bg); padding: 40px 30px; border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 450px; transition: var(--transition); border: 1px solid var(--border-color); }
        h2 { text-align: center; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 5px; }
        .badge-regional { display: inline-block; background-color: #ede9fe; color: #5b21b6; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; margin: 0 auto 25px auto; text-align: center; width: 100%; letter-spacing: 0.5px;}
        [data-theme="dark"] .badge-regional { background-color: #4c1d95; color: #ddd6fe; }

        .input-group { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 14px 40px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; background-color: var(--bg-color); color: var(--text-main); transition: var(--transition); letter-spacing: 2px; text-align: center; font-weight: 600; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        
        /* Tombol Clear (X) */
        .btn-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: none; padding: 5px; border-radius: 50%; transition: var(--transition); }
        .btn-clear:hover { color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }
        .btn-clear svg { width: 20px; height: 20px; }

        button.btn-submit { width: 100%; background-color: var(--primary); color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        button.btn-submit:hover { background-color: var(--primary-hover); }
        
        .result-card { margin-top: 25px; padding: 20px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; display: none; animation: fadeIn 0.4s ease-in-out; }
        .result-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border-color); }
        .result-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .result-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-value { font-size: 1rem; font-weight: 600; color: var(--text-main); }
        .error-msg { color: #ef4444; text-align: center; font-size: 0.9rem; margin-top: 10px; display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #icon-sun { display: none; }
        #icon-moon { display: block; }
        [data-theme="dark"] #icon-sun { display: block; fill: currentColor;}
        [data-theme="dark"] #icon-moon { display: none; }
    </style>
</head>
<body>

    <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>

    <div class="container">
        <h2>Validasi Data</h2>
        <p class="subtitle">Ekstraksi Offline & Akurat</p>
        <div class="badge-regional">Regional: Khusus Sulawesi Selatan</div>
        
        <div class="input-group">
            <!-- maxlength dihapus agar copy-paste angka berspasi tidak terpotong prematurely -->
            <input type="text" id="nikInput" placeholder="Masukkan 16 Digit NIK" oninput="formatInput(this)">
            
            <!-- Tombol X -->
            <button class="btn-clear" id="btnClear" onclick="clearInput()" title="Hapus NIK">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <button class="btn-submit" onclick="cekNIK()">Analisis Data</button>
        <div class="error-msg" id="errorMsg">Mohon masukkan tepat 16 digit NIK (Hanya Angka).</div>

        <div class="result-card" id="resultCard">
            <div class="result-item">
                <div class="result-label">Provinsi</div>
                <div class="result-value" id="resProvinsi">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">Kabupaten / Kota</div>
                <div class="result-value" id="resKabupaten">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">Kecamatan</div>
                <div class="result-value" id="resKecamatan">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">Jenis Kelamin</div>
                <div class="result-value" id="resGender">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">Tempat, Tanggal Lahir</div>
                <div class="result-value" id="resTTL">-</div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const htmlNode = document.documentElement;
            const currentTheme = htmlNode.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlNode.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme');
            if(savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        };

        // Format Input & Tampilkan Tombol X
        function formatInput(el) {
            // Hilangkan semua karakter selain angka (termasuk spasi)
            let val = el.value.replace(/\D/g, '');
            // Potong menjadi maksimal 16 digit
            el.value = val.substring(0, 16);
            
            // Tampilkan tombol X jika ada teks, sembunyikan jika kosong
            document.getElementById('btnClear').style.display = el.value.length > 0 ? 'block' : 'none';
        }

        // Fungsi Hapus Input (Tombol X)
        function clearInput() {
            const input = document.getElementById('nikInput');
            input.value = '';
            document.getElementById('btnClear').style.display = 'none';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
            input.focus(); // Kembalikan kursor ke input
        }

            "7371": { "nama": "KOTA MAKASSAR", "kec": {"01":"MARISO", "02":"MAMAJANG", "03":"MAKASSAR", "04":"UJUNG PANDANG", "05":"WAJO", "06":"BONTOALA", "07":"TELLO BARU", "08":"UJUNG TANAH", "09":"PANAKKUKANG", "10":"TAMALATE", "11":"BIRINGKANAYA", "12":"MANGGALA", "13":"RAPPOCINI", "14":"TAMALANREA", "15":"SANGKARRANG"} },

            "7373": { "nama": "KOTA PALOPO", "kec": {"01":"WARA", "02":"WARA UTARA", "03":"WARA SELATAN", "04":"TELLUWANUA", "05":"WARA TIMUR", "06":"WARA BARAT", "07":"SENDANA", "08":"MUNGKAJANG", "09":"BARA"} }
        };

        function cekNIK() {
            const nik = document.getElementById('nikInput').value;
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            
            resultCard.style.display = 'none';
            errorMsg.style.display = 'none';

            // VALIDASI INPUT: Harus 16 digit angka (Spasi sudah dihilangkan oleh formatInput)
            if(!/^\d{16}$/.test(nik)) {
                errorMsg.style.display = 'block';
                return;
            }

            const kodeProv = nik.substring(0, 2);
            const kodeKab = nik.substring(0, 4);
            const kodeKec = nik.substring(4, 6);
            
            let tanggalLahir = parseInt(nik.substring(6, 8));
            const bulanLahir = nik.substring(8, 10);
            const tahunLahir = parseInt(nik.substring(10, 12));

            if (kodeProv !== "73") {
                errorMsg.innerText = "Alat ini khusus untuk NIK Provinsi Sulawesi Selatan (Awalan 73).";
                errorMsg.style.display = 'block';
                return;
            }

            let namaKab = "Tidak ditemukan", namaKec = "Tidak ditemukan", tempatLahir = "Tidak diketahui";

            const dataDaerah = dbSulsel[kodeKab];
            if (dataDaerah) {
                namaKab = dataDaerah.nama;
                tempatLahir = namaKab.replace(/^(KABUPATEN|KOTA)\s/, '');
                
                if (dataDaerah.kec[kodeKec]) {
                    namaKec = dataDaerah.kec[kodeKec];
                } else if (kodeKec === "10" && kodeKab === "7371") {
                   namaKec = "PANAKKUKANG";
                }
            }

            let gender = 'Laki-laki';
            if (tanggalLahir > 40) {
                gender = 'Perempuan';
                tanggalLahir = tanggalLahir - 40;
            }

            const tahunSekarang = new Date().getFullYear() % 100;
            let tahunPenuh = (tahunLahir <= tahunSekarang) ? 2000 + tahunLahir : 1900 + tahunLahir;

            // LOGIKA UJUNG PANDANG
            if (tempatLahir === "MAKASSAR") {
                const tglLahirObj = new Date(tahunPenuh, parseInt(bulanLahir) - 1, tanggalLahir);
                const batasUjungPandang = new Date(1999, 9, 13); 
                
                if (tglLahirObj < batasUjungPandang) {
                    tempatLahir = "UJUNG PANDANG";
                }
            }

            const formatTanggal = tanggalLahir.toString().padStart(2, '0');
            const formatBulan = getNamaBulan(bulanLahir);

            // RENDER OUTPUT BERSIH (Tanpa tulisan "Kode: ...")
            document.getElementById('resProvinsi').innerText = `SULAWESI SELATAN`;
            document.getElementById('resKabupaten').innerText = namaKab;
            document.getElementById('resKecamatan').innerText = namaKec;
            document.getElementById('resGender').innerText = gender;
            document.getElementById('resTTL').innerText = `${tempatLahir}, ${formatTanggal} ${formatBulan} ${tahunPenuh}`;

            resultCard.style.display = 'block';
        }

        function getNamaBulan(kode) {
            const bulan = {
                "01": "Januari", "02": "Februari", "03": "Maret", "04": "April",
                "05": "Mei", "06": "Juni", "07": "Juli", "08": "Agustus",
                "09": "September", "10": "Oktober", "11": "November", "12": "Desember"
            };
            return bulan[kode] || kode;
        }
    </script>
</body>
</html>
